<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit administrator | FoodFrenzy</title><link rel="stylesheet" th:href="@{/css/Navigation.css}"><link rel="stylesheet" th:href="@{/css/AdminForms.css}"></head>
<body><nav th:replace="~{Navigation::navbar()}"></nav>
<main class="form-page"><a class="back-link" th:href="@{/admin/services}">← Dashboard</a><header><p class="eyebrow">TEAM ACCESS</p><h1>Edit administrator</h1><p>Leave the password empty to keep the existing password.</p></header>
<div class="notice notice-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
<form class="management-form" th:action="@{'/updatingAdmin/' + ${admin.adminId}}" th:object="${admin}" method="post">
    <label for="adminName">Full name</label><input id="adminName" type="text" th:field="*{adminName}" minlength="2" maxlength="80" required>
    <label for="adminEmail">Email address</label><input id="adminEmail" type="email" th:field="*{adminEmail}" required>
    <label for="adminNumber">10 digit phone number</label><input id="adminNumber" type="tel" th:field="*{adminNumber}" pattern="[0-9]{10}" required>
    <label for="adminPassword">New password <span>(optional)</span></label><input id="adminPassword" type="password" name="adminPassword" minlength="8" maxlength="72" autocomplete="new-password">
    <button class="button button-primary" type="submit">Save administrator</button>
</form></main></body></html>
