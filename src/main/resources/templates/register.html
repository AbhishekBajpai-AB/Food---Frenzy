<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FoodFrenzy | Create account</title>
    <link rel="stylesheet" th:href="@{/css/Navigation.css}">
    <link rel="stylesheet" th:href="@{/css/Auth.css}">
</head>
<body class="auth-page">
    <nav th:replace="~{Navigation::navbar()}"></nav>
    <main class="auth-shell register-shell">
        <header class="auth-heading">
            <p class="eyebrow">YOUR TABLE IS WAITING</p>
            <h1>Create your account.</h1>
            <p>It only takes a moment. Your order history will be here whenever you return.</p>
        </header>
        <section class="auth-card register-card">
            <form th:action="@{/register}" th:object="${registration}" method="post">
                <label for="uname">Full name</label>
                <input id="uname" type="text" th:field="*{uname}" autocomplete="name" minlength="2" maxlength="80" required>
                <small class="form-error" th:if="${#fields.hasErrors('uname')}" th:errors="*{uname}"></small>

                <label for="uemail">Email address</label>
                <input id="uemail" type="email" th:field="*{uemail}" autocomplete="email" required>
                <small class="form-error" th:if="${#fields.hasErrors('uemail')}" th:errors="*{uemail}"></small>

                <label for="unumber">10 digit mobile number</label>
                <input id="unumber" type="tel" th:field="*{unumber}" inputmode="numeric" pattern="[0-9]{10}" minlength="10" maxlength="10" required>
                <small class="form-error" th:if="${#fields.hasErrors('unumber')}" th:errors="*{unumber}"></small>

                <label for="upassword">Password</label>
                <input id="upassword" type="password" th:field="*{upassword}" autocomplete="new-password" minlength="8" maxlength="72" required>
                <small class="form-hint">Use at least 8 characters.</small>
                <small class="form-error" th:if="${#fields.hasErrors('upassword')}" th:errors="*{upassword}"></small>

                <button class="button button-primary button-wide" type="submit">Create account</button>
            </form>
            <p class="auth-footnote">Already have an account? <a th:href="@{/login}">Sign in</a></p>
        </section>
    </main>
</body>
</html>
