<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FoodFrenzy | Menu</title>
    <link rel="stylesheet" th:href="@{/css/Navigation.css}">
    <link rel="stylesheet" th:href="@{/css/Products.css}">
</head>
<body>
    <nav th:replace="~{Navigation::navbar()}"></nav>
    <main class="menu-page">
        <header class="menu-heading">
            <p class="eyebrow">FRESH FROM OUR KITCHEN</p>
            <h1>Made to make your day.</h1>
            <p>Choose something you love. Prices and availability update from our menu.</p>
        </header>
        <div class="notice notice-error" th:if="${orderError}" th:text="${orderError}"></div>
        <div class="menu-grid" th:if="${!#lists.isEmpty(products)}">
            <article class="menu-card" th:each="product : ${products}">
                <div class="menu-card-image">
                    <img th:src="${product.imageUrl}" th:alt="${product.pname}" onerror="this.src='/Images/logo.png'">
                    <span class="category-pill" th:text="${product.category}">Category</span>
                </div>
                <div class="menu-card-content">
                    <h2 th:text="${product.pname}">Dish name</h2>
                    <p class="dish-description" th:text="${product.pdescription}">Description</p>
                    <div class="menu-card-footer">
                        <span class="dish-price" th:text="|₹${product.pprice}|">₹0</span>
                        <a th:if="${product.stockQuantity > 0 and session.authRole == 'USER'}" class="button button-primary" th:href="@{'/product/buy/' + ${product.pid}}">Order</a>
                        <a th:if="${product.stockQuantity > 0 and session.authRole != 'USER'}" class="button button-primary" th:href="@{/login(required='user')}">Order</a>
                        <span th:if="${product.stockQuantity <= 0}" class="sold-out">Sold out</span>
                    </div>
                    <p class="stock-note" th:text="|${product.stockQuantity} portions available|">Availability</p>
                </div>
            </article>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(products)}">
            <h2>Our menu is being refreshed.</h2>
            <p>Please check back soon for today's dishes.</p>
        </div>
    </main>
</body>
</html>
