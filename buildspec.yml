version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - mvn -v

  build:
    commands:
      - echo "Building project..."
      - mvn --batch-mode clean package -DskipTests

  post_build:
    commands:
      - echo "Preparing artifact..."
      - mkdir -p output
      - cp target/*.jar output/ || true
      - ls -l output || true

artifacts:
  files:
    - output/*.jar
    - appspec.yml
    - scripts/**/*
